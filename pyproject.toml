[project]
name = "ytscribe"
version = "0.1.0"
description = "Get transcripts for YouTube videos, playlists and channels: existing captions first, local or API speech-to-text otherwise"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "yt-dlp>=2026.8.19",
    "youtube-transcript-api>=1.2",
    "webvtt-py>=0.5",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.3",
    "loguru>=0.7",
]

[project.optional-dependencies]
asr = ["mlx-whisper>=0.4"]
mistral = ["mistralai>=1.9"]
analysis = ["pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.5", "ruptures>=1.1", "regex>=2024.5", "scattertext>=0.2", "matplotlib>=3.8", "rapidfuzz>=3.9"]
sentiment = ["vaderSentiment>=3.3"]
topics = ["bertopic>=0.16", "sentence-transformers>=3"]
slides = ["Pillow>=10", "imagehash>=4.3", "ocrmac>=1.0; sys_platform == 'darwin'"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
ys = "ytscribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytscribe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning:scattertext.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# dated spikes kept as evidence of how the first numbers were produced, not product code
"scripts/*" = ["E741", "B007", "E402", "B905"]
